name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
  self-test:
    name: Run against fixture role
    uses: ./.github/workflows/ansible-role-ci.yml
    with:
      ansible_versions: '["2.19"]'
      lint_os: '["ubuntu-latest"]'
      e2e_os: '["ubuntu-latest"]'

  build-results:
    name: Build results
    if: always()
    runs-on: ubuntu-latest
    needs:
      - actionlint
      - self-test
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
                contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
                || contains(needs.*.result, 'skipped')
                }}
