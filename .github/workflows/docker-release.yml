name: Docker Image Release

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON array of fully-qualified image names to tag and push, e.g.
          '["ghcr.io/m13tlabs/foo","docker.io/m13t/foo"]'. Every entry is tagged
          with the full version, the `major.minor` alias and `latest`, and gets
          its own build-provenance attestation.
        type: string
        required: true
      client_id:
        description: 'GitHub Client ID whose private key is passed as the CI_PRIVATE_KEY secret'
        type: string
        required: true
      release_type:
        description: 'Type of release to build: patch, minor, major, or custom'
        type: string
        required: false
        default: 'patch'
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
        default: ''
      default_branch:
        description: 'Branch to release from and push commits/tags back to'
        type: string
        required: false
        default: 'develop'
      version_file:
        description: 'JSON file holding the current version under a top-level "version" key'
        type: string
        required: false
        default: 'config.json'
      context:
        description: Docker build context
        type: string
        required: false
        default: '.'
      dockerfile:
        description: Path to the Dockerfile, relative to context
        type: string
        required: false
        default: Dockerfile
      variant_dockerfile:
        description: >-
          Optional second Dockerfile (relative to context) built and pushed
          alongside the main one, e.g. a GPU image. Its tags are the same
          version / major.minor / latest set with `variant_suffix` appended, and
          it gets its own provenance attestation. Empty disables the variant build.
        type: string
        required: false
        default: ''
      variant_suffix:
        description: 'Tag suffix for the variant_dockerfile images (e.g. 1.2.3-gpu, latest-gpu)'
        type: string
        required: false
        default: '-gpu'
      platforms:
        description: Comma-separated build platforms
        type: string
        required: false
        default: 'linux/amd64,linux/arm64'
      dockerhub:
        description: 'Log in to Docker Hub before pushing (needs DOCKER_HUB_USER / DOCKER_HUB_TOKEN)'
        type: boolean
        required: false
        default: false
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: false
        default: true
    secrets:
      CI_PRIVATE_KEY:
        description: 'Private key for the GitHub App identified by app_id'
        required: true
      DOCKER_HUB_USER:
        description: 'Docker Hub username (only when dockerhub: true)'
        required: false
      DOCKER_HUB_TOKEN:
        description: 'Docker Hub access token (only when dockerhub: true)'
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      variant_digest: ${{ steps.push_variant.outputs.digest }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-towken.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.default_branch }}

      - name: Configure Git author
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Determine release version
        id: version
        run: |
          currentVersion=$(jq -r '.version' "${{ inputs.version_file }}")

          case "${{ inputs.release_type }}" in
            custom)
              releaseVersion="${{ inputs.custom_version }}"
              if [ -z "$releaseVersion" ]; then
                echo "custom_version is required when release_type is 'custom'" >&2
                exit 1
              fi
              ;;
            major|minor|patch)
              IFS='.' read -r major minor patch <<< "$currentVersion"
              case "${{ inputs.release_type }}" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              releaseVersion="${major}.${minor}.${patch}"
              ;;
            *)
              echo "Unknown release_type '${{ inputs.release_type }}'" >&2
              exit 1
              ;;
          esac

          echo "Releasing version $releaseVersion (current: $currentVersion)"
          IFS='.' read -r relMajor relMinor _ <<< "$releaseVersion"
          {
            echo "release_version=$releaseVersion"
            echo "release_version_minor=${relMajor}.${relMinor}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version
        run: |
          jq '.version = "${{ steps.version.outputs.release_version }}"' "${{ inputs.version_file }}" > "${{ inputs.version_file }}.new"
          mv "${{ inputs.version_file }}.new" "${{ inputs.version_file }}"
          git add "${{ inputs.version_file }}"
          git commit -m "Release ${{ steps.version.outputs.release_version }}"

      - name: Update changelog
        run: |
          pip install git-cliff

          if [ ! -f cliff.toml ]; then
            cat > cliff.toml <<'EOF'
          [changelog]
          header = ""
          body = """
          {% if version %}\
          ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/${{ github.repository }}/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
          {% else %}\
          ## [Unreleased]
          {% endif %}\

          {% for group, commits in commits | group_by(attribute="group") %}
          ### {{ group }}

          {% for commit in commits %}\
          * {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
          ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/${{ github.repository }}/commit/{{ commit.id }}))\
          {% if commit.breaking %} **BREAKING CHANGE**{% endif %}

          {% endfor %}
          {% endfor %}\n
          """
          trim = true
          footer = ""

          [git]
          conventional_commits = true
          filter_unconventional = true
          split_commits = false
          tag_pattern = "v[0-9].*"
          sort_commits = "oldest"

          commit_parsers = [
              { message = "^feat", group = "Features" },
              { message = "^fix", group = "Bug Fixes" },
              { message = "^perf", group = "Performance" },
              { message = "^refactor", group = "Refactoring" },
              { message = "^doc|^docs", group = "Documentation" },
              { message = "^test", group = "Testing" },
              { message = "^chore\\(deps\\)", group = "Dependency Updates" },
              { message = "^chore", skip = true },
              { message = "^ci", skip = true },
              { message = "^style", skip = true },
              { body = ".*security", group = "Security" },
          ]

          protect_breaking_commits = false
          filter_commits = true
          EOF
            git add cliff.toml
          fi

          touch CHANGELOG.md
          git-cliff --config cliff.toml --tag "v${{ steps.version.outputs.release_version }}" --unreleased --prepend CHANGELOG.md
          git-cliff --config cliff.toml --tag "v${{ steps.version.outputs.release_version }}" --latest --strip header > RELEASE_NOTES.md

          git add CHANGELOG.md
          git commit -m "chore: Changelog for Release ${{ steps.version.outputs.release_version }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ join(fromJson(inputs.images), ',') }}
          tags: |
            type=raw,value=${{ steps.version.outputs.release_version }}
            type=raw,value=${{ steps.version.outputs.release_version_minor }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.release_version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-main
          cache-to: type=gha,mode=max,scope=release-main

      - name: Docker metadata (variant)
        id: meta_variant
        if: inputs.variant_dockerfile != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ join(fromJson(inputs.images), ',') }}
          flavor: |
            latest=false
            suffix=${{ inputs.variant_suffix }}
          tags: |
            type=raw,value=${{ steps.version.outputs.release_version }}
            type=raw,value=${{ steps.version.outputs.release_version_minor }}
            type=raw,value=latest

      - name: Build and push (variant)
        id: push_variant
        if: inputs.variant_dockerfile != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.variant_dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta_variant.outputs.tags }}
          labels: ${{ steps.meta_variant.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.release_version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-variant
          cache-to: type=gha,mode=max,scope=release-variant

      - name: Refresh GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token-push
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Push commits
        run: |
          git push "https://x-access-token:${{ steps.app-token-push.outputs.token }}@github.com/${{ github.repository }}.git" HEAD:${{ inputs.default_branch }}

      - name: Create Release on GH
        env:
          GH_TOKEN: ${{ steps.app-token-push.outputs.token }}
        run: |
          gh release create "v${{ steps.version.outputs.release_version }}" \
            ${{ inputs.draft_release && '--draft' || '' }} \
            --title "${{ steps.version.outputs.release_version }}" \
            --notes-file RELEASE_NOTES.md

  attest:
    name: Attest ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: release
    permissions:
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        image: ${{ fromJson(inputs.images) }}
    steps:
      - name: Log in to GHCR
        if: startsWith(matrix.image, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.dockerhub && startsWith(matrix.image, 'docker.io/')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Attest image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ needs.release.outputs.digest }}
          push-to-registry: true

      - name: Attest image (variant)
        if: needs.release.outputs.variant_digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ needs.release.outputs.variant_digest }}
          push-to-registry: true
