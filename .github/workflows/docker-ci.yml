name: Docker Image CI

on:
  workflow_call:
    inputs:
      image_name:
        description: Local tag prefix the CI builds are loaded as (used only inside this workflow)
        type: string
        default: ci-image
      context:
        description: Docker build context passed to docker/build-push-action
        type: string
        default: '.'
      dockerfiles:
        description: >-
          JSON array of Dockerfile paths (relative to context). Each is linted
          with hadolint and built + smoke-tested as its own matrix leg, e.g.
          '["Dockerfile","Dockerfile.gpu"]'.
        type: string
        default: '["Dockerfile"]'
      build_args:
        description: Newline-separated build args forwarded to every build
        type: string
        default: ''
      dockerhub:
        description: 'Log in to Docker Hub before pushing (needs DOCKER_HUB_USER / DOCKER_HUB_TOKEN)'
        type: boolean
        required: false
        default: false
      smoke_test:
        description: >-
          Shell run by the "Smoke test" step with $IMAGE set to the built local
          tag, once per Dockerfile. Defaults to `docker run --rm "$IMAGE" --help`.
          Set to an empty string to skip the smoke test entirely.
        type: string
        default: docker run --rm "$IMAGE" --help
      platforms:
        description: >-
          Comma-separated platforms every Dockerfile is additionally built for
          (not loaded or smoke-tested), matching docker-release.yml's default so
          emulated (QEMU) arm64 failures surface in CI instead of mid-release.
          Set to an empty string to skip.
        type: string
        default: 'linux/amd64,linux/arm64'
      dockerfile_platforms:
        description: >-
          JSON object overriding `platforms` per Dockerfile, e.g.
          '{"Dockerfile.gpu":"linux/amd64"}' for a base image published amd64-only
          (mirror docker-release.yml's variant_platforms).
        type: string
        default: '{}'
      runs_on:
        description: Runner for every job
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check

  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(inputs.dockerfiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.context }}/${{ matrix.dockerfile }}

  build:
    name: Build and smoke-test (${{ matrix.dockerfile }})
    runs-on: ${{ inputs.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(inputs.dockerfiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Local tag for this Dockerfile
        id: prep
        run: |
          # Key the cache scope on context too, so a repo calling this workflow
          # once per image directory doesn't share one scope for every
          # `Dockerfile`. The default context keeps the old, bare scope name.
          ref='${{ matrix.dockerfile }}'
          if [ '${{ inputs.context }}' != '.' ]; then ref='${{ inputs.context }}/'"$ref"; fi
          slug="$(printf '%s' "$ref" | tr -c 'A-Za-z0-9_.-' '-')"
          {
            echo "slug=${slug}"
            echo "tag=${{ inputs.image_name }}:ci-${slug}"
            echo "platforms=${{ fromJson(inputs.dockerfile_platforms)[matrix.dockerfile] || inputs.platforms }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.prep.outputs.tag }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.slug }}

      - name: Smoke test
        if: inputs.smoke_test != ''
        env:
          IMAGE: ${{ steps.prep.outputs.tag }}
        run: ${{ inputs.smoke_test }}

      # Same platforms and emulation as docker-release.yml, which also relies on
      # buildkit's built-in QEMU (no setup-qemu-action) - keep the two in sync so
      # an arm64-only failure (e.g. uutils `env` rejecting QEMU's argv[0] on
      # Ubuntu 26.04 bases) fails here rather than in the release run.
      - name: Build release platforms
        if: steps.prep.outputs.platforms != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ matrix.dockerfile }}
          platforms: ${{ steps.prep.outputs.platforms }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.slug }}

  build-results:
    name: Build results
    if: always()
    runs-on: ${{ inputs.runs_on }}
    needs: [actionlint, hadolint, build]
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
