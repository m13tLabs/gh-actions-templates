name: Docker Image CI

on:
  workflow_call:
    inputs:
      image_name:
        description: Local tag the CI build is loaded as (used only inside this workflow)
        type: string
        default: ci-image
      context:
        description: Docker build context passed to docker/build-push-action
        type: string
        default: '.'
      dockerfile:
        description: Path to the Dockerfile, relative to context
        type: string
        default: Dockerfile
      build_args:
        description: Newline-separated build args forwarded to the build
        type: string
        default: ''
      smoke_test:
        description: >-
          Shell run by the "Smoke test" step with $IMAGE set to the built local
          tag. Defaults to `docker run --rm "$IMAGE" --help`. Set to an empty
          string to skip the smoke test entirely.
        type: string
        default: docker run --rm "$IMAGE" --help
      runs_on:
        description: Runner for every job
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check

  hadolint:
    name: hadolint
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}

  build:
    name: Build and smoke-test
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image_name }}:ci
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: inputs.smoke_test != ''
        env:
          IMAGE: ${{ inputs.image_name }}:ci
        run: ${{ inputs.smoke_test }}

  build-results:
    name: Build results
    if: always()
    runs-on: ${{ inputs.runs_on }}
    needs: [actionlint, hadolint, build]
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
