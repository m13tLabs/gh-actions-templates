name: Gradle Release

on:
  workflow_call:
    inputs:
      client_id:
        description: 'GitHub Client ID whose private key is passed as the CI_PRIVATE_KEY secret'
        type: string
        required: true
      release_type:
        description: >-
          Type of release to build: patch, minor, major, or custom. The base is
          the latest vX.Y.Z git tag or GitHub release, drafts included (0.0.0
          when there is none): patch releases
          X.Y.(Z+1), minor X.(Y+1).0 and major (X+1).0.0.
        type: string
        required: false
        default: 'patch'
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
        default: ''
      default_branch:
        description: 'Branch to release from and push commits/tags back to'
        type: string
        required: false
        default: 'develop'
      java_version:
        description: 'JDK version passed to actions/setup-java'
        type: string
        required: false
        default: '25'
      java_distribution:
        description: 'JDK distribution passed to actions/setup-java'
        type: string
        required: false
        default: 'temurin'
      version_property:
        description: 'Gradle project property the release version is passed as (-P<version_property>=X.Y.Z)'
        type: string
        required: false
        default: 'releaseVersion'
      gradle_tasks:
        description: >-
          Space-separated Gradle tasks that publish the release, e.g.
          'publishAndReleaseToMavenCentral publishPlugins'. When publishPlugins
          is among them, 'publishPlugins --validate-only' runs first.
        type: string
        required: false
        default: 'publishAndReleaseToMavenCentral'
      gradle_args:
        description: "Extra arguments for every Gradle run, e.g. '-x test'"
        type: string
        required: false
        default: ''
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: false
        default: true
    outputs:
      release_version:
        description: 'The version this run released (X.Y.Z)'
        value: ${{ jobs.release.outputs.release_version }}
      release_sha:
        description: 'SHA of the release commit (changelog), i.e. what was published'
        value: ${{ jobs.release.outputs.release_sha }}
    secrets:
      CI_PRIVATE_KEY:
        description: 'Private key for the GitHub App identified by client_id'
        required: true
      OSS_SONATYPE_USER:
        description: 'Central Portal user token name (ORG_GRADLE_PROJECT_mavenCentralUsername)'
        required: false
      OSS_SONATYPE_PASS:
        description: 'Central Portal user token password (ORG_GRADLE_PROJECT_mavenCentralPassword)'
        required: false
      OSS_SONATYPE_GPG_PRIVATE_KEY:
        description: 'ASCII-armored GPG private key (ORG_GRADLE_PROJECT_signingInMemoryKey)'
        required: false
      OSS_SONATYPE_GPG_PASSPHRASE:
        description: 'Passphrase of OSS_SONATYPE_GPG_PRIVATE_KEY (ORG_GRADLE_PROJECT_signingInMemoryKeyPassword)'
        required: false
      GRADLE_PUBLISH_KEY:
        description: 'Gradle Plugin Portal API key (for publishPlugins)'
        required: false
      GRADLE_PUBLISH_SECRET:
        description: 'Gradle Plugin Portal API secret (for publishPlugins)'
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_sha: ${{ steps.release_commit.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.default_branch }}

      - name: Configure Git author
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Select Gradle
        run: |
          if [ -x ./gradlew ]; then
            echo "GRADLE=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE=gradle" >> "$GITHUB_ENV"
          fi

      # Exported only when set: an empty ORG_GRADLE_PROJECT_signingInMemoryKey still
      # defines the property and makes signing fail instead of being skipped.
      - name: Export publishing credentials
        env:
          CENTRAL_USER: ${{ secrets.OSS_SONATYPE_USER }}
          CENTRAL_PASS: ${{ secrets.OSS_SONATYPE_PASS }}
          GPG_KEY: ${{ secrets.OSS_SONATYPE_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.OSS_SONATYPE_GPG_PASSPHRASE }}
          PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          addEnv() {
            [ -n "$2" ] || return 0
            delim="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delim" "$2" "$delim" >> "$GITHUB_ENV"
          }
          addEnv ORG_GRADLE_PROJECT_mavenCentralUsername "$CENTRAL_USER"
          addEnv ORG_GRADLE_PROJECT_mavenCentralPassword "$CENTRAL_PASS"
          addEnv ORG_GRADLE_PROJECT_signingInMemoryKey "$GPG_KEY"
          addEnv ORG_GRADLE_PROJECT_signingInMemoryKeyPassword "$GPG_PASS"
          addEnv GRADLE_PUBLISH_KEY "$PUBLISH_KEY"
          addEnv GRADLE_PUBLISH_SECRET "$PUBLISH_SECRET"

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          # Draft releases have no git tag yet, so include the GitHub releases' tag names.
          knownTags=$( { git tag -l 'v[0-9]*'; gh release list --limit 200 --json tagName --jq '.[].tagName'; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV || true)
          latestTag=$(tail -n1 <<< "$knownTags")
          latestTag="${latestTag:-v0.0.0}"
          baseVersion="${latestTag#v}"

          case "$RELEASE_TYPE" in
            custom)
              releaseVersion="$CUSTOM_VERSION"
              if [ -z "$releaseVersion" ]; then
                echo "custom_version is required when release_type is 'custom'" >&2
                exit 1
              fi
              ;;
            major|minor|patch)
              IFS='.' read -r major minor patch <<< "$baseVersion"
              case "$RELEASE_TYPE" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              releaseVersion="${major}.${minor}.${patch}"
              ;;
            *)
              echo "Unknown release_type '$RELEASE_TYPE'" >&2
              exit 1
              ;;
          esac

          if grep -qxF "v$releaseVersion" <<< "$knownTags"; then
            echo "Tag or release v$releaseVersion already exists" >&2
            exit 1
          fi

          echo "Releasing version $releaseVersion (latest tag: $latestTag)"
          echo "release_version=$releaseVersion" >> "$GITHUB_OUTPUT"

      # The Plugin Portal validates metadata (e.g. tags) server-side only. Check it before
      # anything is published, so a rejected plugin can't leave a half-released version
      # on Maven Central.
      - name: Validate Plugin Portal metadata
        env:
          GRADLE_TASKS: ${{ inputs.gradle_tasks }}
          GRADLE_ARGS_INPUT: ${{ inputs.gradle_args }}
          VERSION_PROPERTY: ${{ inputs.version_property }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          read -ra tasks <<< "$GRADLE_TASKS"
          case " ${tasks[*]} " in
            *" publishPlugins "*) ;;
            *) echo "publishPlugins not in gradle_tasks, skipping"; exit 0 ;;
          esac
          read -ra extraArgs <<< "$GRADLE_ARGS_INPUT"
          $GRADLE --no-daemon publishPlugins --validate-only "-P${VERSION_PROPERTY}=${RELEASE_VERSION}" "${extraArgs[@]}"

      - name: Update changelog
        id: release_commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          pip install git-cliff

          if [ ! -f cliff.toml ]; then
            cat > cliff.toml <<'EOF'
          [changelog]
          header = ""
          body = """
          {% if version %}\
          ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/${{ github.repository }}/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
          {% else %}\
          ## [Unreleased]
          {% endif %}\

          {% for group, commits in commits | group_by(attribute="group") %}
          ### {{ group }}

          {% for commit in commits %}\
          * {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
          ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/${{ github.repository }}/commit/{{ commit.id }}))\
          {% if commit.breaking %} **BREAKING CHANGE**{% endif %}

          {% endfor %}
          {% endfor %}\n
          """
          trim = true
          footer = ""

          [git]
          conventional_commits = true
          filter_unconventional = true
          split_commits = false
          tag_pattern = "v[0-9].*"
          sort_commits = "oldest"

          commit_parsers = [
              { message = "^feat", group = "Features" },
              { message = "^fix", group = "Bug Fixes" },
              { message = "^perf", group = "Performance" },
              { message = "^refactor", group = "Refactoring" },
              { message = "^doc|^docs", group = "Documentation" },
              { message = "^test", group = "Testing" },
              { message = "^chore\\(deps\\)", group = "Dependency Updates" },
              { message = "^chore", skip = true },
              { message = "^ci", skip = true },
              { message = "^style", skip = true },
              { body = ".*security", group = "Security" },
          ]

          protect_breaking_commits = false
          filter_commits = true
          EOF
            git add cliff.toml
          fi

          touch CHANGELOG.md
          git-cliff --config cliff.toml --tag "v$RELEASE_VERSION" --unreleased --prepend CHANGELOG.md
          git-cliff --config cliff.toml --tag "v$RELEASE_VERSION" --unreleased --strip header > RELEASE_NOTES.md

          git add CHANGELOG.md
          git commit -m "chore: Changelog for Release $RELEASE_VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GRADLE_TASKS: ${{ inputs.gradle_tasks }}
          GRADLE_ARGS_INPUT: ${{ inputs.gradle_args }}
          VERSION_PROPERTY: ${{ inputs.version_property }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          read -ra tasks <<< "$GRADLE_TASKS"
          read -ra extraArgs <<< "$GRADLE_ARGS_INPUT"
          $GRADLE --no-daemon "${tasks[@]}" "-P${VERSION_PROPERTY}=${RELEASE_VERSION}" "${extraArgs[@]}"

      # The publish can outlast the 1h token minted at job start.
      - name: Refresh GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token-push
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Push commits
        env:
          GH_TOKEN: ${{ steps.app-token-push.outputs.token }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${DEFAULT_BRANCH}"

      - name: Create Release on GH
        env:
          GH_TOKEN: ${{ steps.app-token-push.outputs.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            ${{ inputs.draft_release && '--draft' || '' }} \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_VERSION" \
            --notes-file RELEASE_NOTES.md
